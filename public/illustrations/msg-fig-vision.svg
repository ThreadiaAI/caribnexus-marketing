<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Receipt/document -->
  <rect x="120" y="120" width="160" height="210" rx="4" fill="#f0f7fa" stroke="#0077B6" stroke-width="1" opacity="0.8"/>
  <!-- Receipt lines -->
  <rect x="140" y="145" width="80" height="3" rx="1.5" fill="#0077B6" opacity="0.2"/>
  <rect x="140" y="155" width="60" height="3" rx="1.5" fill="#0077B6" opacity="0.15"/>
  <line x1="135" y1="170" x2="265" y2="170" stroke="#0077B6" stroke-width="0.5" opacity="0.3"/>
  <rect x="140" y="180" width="100" height="3" rx="1.5" fill="#0077B6" opacity="0.2"/>
  <rect x="140" y="190" width="70" height="3" rx="1.5" fill="#0077B6" opacity="0.15"/>
  <rect x="140" y="200" width="90" height="3" rx="1.5" fill="#0077B6" opacity="0.2"/>
  <rect x="140" y="215" width="50" height="3" rx="1.5" fill="#0077B6" opacity="0.15"/>
  <line x1="135" y1="230" x2="265" y2="230" stroke="#0077B6" stroke-width="0.5" opacity="0.3"/>
  <rect x="140" y="240" width="40" height="3" rx="1.5" fill="#0077B6" opacity="0.2"/>
  <rect x="220" y="240" width="40" height="3" rx="1.5" fill="#0077B6" opacity="0.2"/>
  <rect x="140" y="260" width="80" height="5" rx="2" fill="#0077B6" opacity="0.3"/>

  <!-- Lens/eye overlay -->
  <ellipse cx="200" cy="220" rx="70" ry="70" fill="none" stroke="#0077B6" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="200" cy="220" r="25" fill="none" stroke="#0077B6" stroke-width="2"/>
  <circle cx="200" cy="220" r="8" fill="#0077B6" opacity="0.3"/>

  <!-- Scanning beam -->
  <line x1="130" y1="200" x2="270" y2="200" stroke="#0077B6" stroke-width="1" opacity="0.5">
    <animate attributeName="y1" values="160;280;160" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="160;280;160" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Extracted data floating up -->
  <g opacity="0.9">
    <!-- Amount -->
    <rect x="60" y="70" width="65" height="22" rx="4" fill="white" stroke="#0077B6" stroke-width="1"/>
    <text x="70" y="85" font-family="system-ui" font-size="9" fill="#0077B6" font-weight="600">$15,000</text>
    <line x1="92" y1="92" x2="170" y2="150" stroke="#0077B6" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>

    <!-- Date -->
    <rect x="270" y="80" width="70" height="22" rx="4" fill="white" stroke="#0077B6" stroke-width="1"/>
    <text x="278" y="95" font-family="system-ui" font-size="9" fill="#0077B6" font-weight="600">Aug 2, 2026</text>
    <line x1="290" y1="102" x2="240" y2="160" stroke="#0077B6" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>

    <!-- Vendor -->
    <rect x="155" y="50" width="90" height="22" rx="4" fill="white" stroke="#0077B6" stroke-width="1"/>
    <text x="165" y="65" font-family="system-ui" font-size="9" fill="#0077B6" font-weight="600">Flow Jamaica</text>
    <line x1="200" y1="72" x2="200" y2="120" stroke="#0077B6" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
  </g>

  <!-- Up arrows -->
  <path d="M 92 100 L 92 92" stroke="#0077B6" stroke-width="1" stroke-linecap="round"/>
  <path d="M 89 95 L 92 92 L 95 95" stroke="#0077B6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 200 80 L 200 72" stroke="#0077B6" stroke-width="1" stroke-linecap="round"/>
  <path d="M 197 75 L 200 72 L 203 75" stroke="#0077B6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 305 108 L 305 100" stroke="#0077B6" stroke-width="1" stroke-linecap="round"/>
  <path d="M 302 103 L 305 100 L 308 103" stroke="#0077B6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
