<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Week 1 label -->
  <text x="70" y="350" font-family="system-ui" font-size="9" fill="#FF5733" opacity="0.6">Week 1</text>
  <!-- Week 4 label -->
  <text x="290" y="350" font-family="system-ui" font-size="9" fill="#FF5733" opacity="0.9">Week 4</text>

  <!-- Timeline arrow -->
  <line x1="60" y1="330" x2="340" y2="330" stroke="#FF5733" stroke-width="1" opacity="0.3"/>
  <path d="M 335 327 L 340 330 L 335 333" stroke="#FF5733" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- Week 1: sparse nodes -->
  <circle cx="80" cy="200" r="6" fill="#FF5733" opacity="0.3"/>
  <circle cx="110" cy="160" r="5" fill="#FF5733" opacity="0.25"/>
  <circle cx="100" cy="250" r="4" fill="#FF5733" opacity="0.2"/>
  <circle cx="130" cy="220" r="5" fill="#FF5733" opacity="0.25"/>
  <!-- Sparse connections -->
  <line x1="80" y1="200" x2="110" y2="160" stroke="#FF5733" stroke-width="0.5" opacity="0.2"/>
  <line x1="80" y1="200" x2="130" y2="220" stroke="#FF5733" stroke-width="0.5" opacity="0.2"/>

  <!-- Week 2: growing -->
  <circle cx="170" cy="180" r="6" fill="#FF5733" opacity="0.4"/>
  <circle cx="190" cy="230" r="5" fill="#FF5733" opacity="0.35"/>
  <circle cx="160" cy="250" r="5" fill="#FF5733" opacity="0.3"/>
  <circle cx="200" cy="160" r="4" fill="#FF5733" opacity="0.35"/>
  <circle cx="180" cy="140" r="4" fill="#FF5733" opacity="0.3"/>
  <line x1="170" y1="180" x2="190" y2="230" stroke="#FF5733" stroke-width="0.7" opacity="0.3"/>
  <line x1="170" y1="180" x2="200" y2="160" stroke="#FF5733" stroke-width="0.7" opacity="0.3"/>
  <line x1="170" y1="180" x2="160" y2="250" stroke="#FF5733" stroke-width="0.5" opacity="0.25"/>
  <line x1="200" y1="160" x2="180" y2="140" stroke="#FF5733" stroke-width="0.5" opacity="0.25"/>
  <line x1="190" y1="230" x2="160" y2="250" stroke="#FF5733" stroke-width="0.5" opacity="0.25"/>

  <!-- Week 3-4: dense network -->
  <circle cx="260" cy="170" r="7" fill="#FF5733" opacity="0.6"/>
  <circle cx="290" cy="200" r="8" fill="#FF5733" opacity="0.7"/>
  <circle cx="270" cy="240" r="6" fill="#FF5733" opacity="0.55"/>
  <circle cx="310" cy="160" r="5" fill="#FF5733" opacity="0.5"/>
  <circle cx="330" cy="220" r="6" fill="#FF5733" opacity="0.6"/>
  <circle cx="250" cy="210" r="5" fill="#FF5733" opacity="0.5"/>
  <circle cx="300" cy="260" r="5" fill="#FF5733" opacity="0.5"/>
  <circle cx="320" cy="180" r="4" fill="#FF5733" opacity="0.55"/>
  <circle cx="280" cy="140" r="4" fill="#FF5733" opacity="0.45"/>
  <circle cx="340" cy="250" r="4" fill="#FF5733" opacity="0.5"/>
  <circle cx="250" cy="270" r="4" fill="#FF5733" opacity="0.4"/>

  <!-- Dense connections -->
  <line x1="260" y1="170" x2="290" y2="200" stroke="#FF5733" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="170" x2="310" y2="160" stroke="#FF5733" stroke-width="0.8" opacity="0.4"/>
  <line x1="260" y1="170" x2="250" y2="210" stroke="#FF5733" stroke-width="0.8" opacity="0.4"/>
  <line x1="260" y1="170" x2="280" y2="140" stroke="#FF5733" stroke-width="0.7" opacity="0.35"/>
  <line x1="290" y1="200" x2="330" y2="220" stroke="#FF5733" stroke-width="1" opacity="0.5"/>
  <line x1="290" y1="200" x2="270" y2="240" stroke="#FF5733" stroke-width="1" opacity="0.5"/>
  <line x1="290" y1="200" x2="320" y2="180" stroke="#FF5733" stroke-width="0.8" opacity="0.4"/>
  <line x1="290" y1="200" x2="310" y2="160" stroke="#FF5733" stroke-width="0.8" opacity="0.4"/>
  <line x1="270" y1="240" x2="300" y2="260" stroke="#FF5733" stroke-width="0.8" opacity="0.4"/>
  <line x1="270" y1="240" x2="250" y2="270" stroke="#FF5733" stroke-width="0.7" opacity="0.35"/>
  <line x1="270" y1="240" x2="250" y2="210" stroke="#FF5733" stroke-width="0.7" opacity="0.35"/>
  <line x1="330" y1="220" x2="340" y2="250" stroke="#FF5733" stroke-width="0.8" opacity="0.4"/>
  <line x1="330" y1="220" x2="300" y2="260" stroke="#FF5733" stroke-width="0.7" opacity="0.35"/>
  <line x1="310" y1="160" x2="320" y2="180" stroke="#FF5733" stroke-width="0.8" opacity="0.4"/>
  <line x1="310" y1="160" x2="280" y2="140" stroke="#FF5733" stroke-width="0.7" opacity="0.35"/>
  <line x1="250" y1="210" x2="270" y2="240" stroke="#FF5733" stroke-width="0.7" opacity="0.35"/>
  <line x1="320" y1="180" x2="330" y2="220" stroke="#FF5733" stroke-width="0.7" opacity="0.35"/>
  <line x1="300" y1="260" x2="340" y2="250" stroke="#FF5733" stroke-width="0.7" opacity="0.35"/>
</svg>
