<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Speech bubble -->
  <rect x="60" y="100" width="280" height="160" rx="20" fill="#f0faf5" stroke="#00A859" stroke-width="1.5"/>
  <polygon points="140,260 160,260 130,295" fill="#f0faf5" stroke="#00A859" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Waveform bars inside bubble -->
  <g transform="translate(100, 155)">
    <rect x="0" y="25" width="4" height="20" rx="2" fill="#00A859" opacity="0.6"/>
    <rect x="10" y="15" width="4" height="40" rx="2" fill="#00A859" opacity="0.7"/>
    <rect x="20" y="8" width="4" height="54" rx="2" fill="#00A859" opacity="0.85"/>
    <rect x="30" y="18" width="4" height="34" rx="2" fill="#00A859" opacity="0.7"/>
    <rect x="40" y="5" width="4" height="60" rx="2" fill="#00A859"/>
    <rect x="50" y="12" width="4" height="46" rx="2" fill="#00A859" opacity="0.9"/>
    <rect x="60" y="20" width="4" height="30" rx="2" fill="#00A859" opacity="0.7"/>
    <rect x="70" y="8" width="4" height="54" rx="2" fill="#00A859" opacity="0.85"/>
    <rect x="80" y="15" width="4" height="40" rx="2" fill="#00A859" opacity="0.7"/>
    <rect x="90" y="22" width="4" height="26" rx="2" fill="#00A859" opacity="0.6"/>
    <rect x="100" y="10" width="4" height="50" rx="2" fill="#00A859" opacity="0.8"/>
    <rect x="110" y="18" width="4" height="34" rx="2" fill="#00A859" opacity="0.7"/>
    <rect x="120" y="25" width="4" height="20" rx="2" fill="#00A859" opacity="0.5"/>
    <rect x="130" y="12" width="4" height="46" rx="2" fill="#00A859" opacity="0.8"/>
    <rect x="140" y="20" width="4" height="30" rx="2" fill="#00A859" opacity="0.65"/>
    <rect x="150" y="28" width="4" height="14" rx="2" fill="#00A859" opacity="0.4"/>
  </g>

  <!-- Arrow showing transcription -->
  <path d="M 270 180 L 310 180" stroke="#00A859" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 305 175 L 310 180 L 305 185" stroke="#00A859" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text lines (transcribed output) -->
  <rect x="270" y="195" width="50" height="3" rx="1.5" fill="#00A859" opacity="0.4"/>
  <rect x="270" y="203" width="40" height="3" rx="1.5" fill="#00A859" opacity="0.3"/>
  <rect x="270" y="211" width="45" height="3" rx="1.5" fill="#00A859" opacity="0.2"/>

  <!-- Mic icon -->
  <rect x="75" y="155" width="12" height="22" rx="6" fill="none" stroke="#00A859" stroke-width="1.5"/>
  <path d="M 71 172 C 71 180, 85 180, 85 172" fill="none" stroke="#00A859" stroke-width="1.5"/>
  <line x1="78" y1="180" x2="78" y2="186" stroke="#00A859" stroke-width="1.5"/>
</svg>
